[project]
name = "ai-portfolio"
version = "0.1.0"
description = "AI-powered portfolio chatbot API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.40.0",
    "openai>=1.12.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
backend-path = ["."]

[tool.hatchling]
version = "0.1.0"
